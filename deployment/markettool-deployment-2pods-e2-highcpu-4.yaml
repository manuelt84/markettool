apiVersion: apps/v1
kind: Deployment
metadata:
  name: markettool
spec:
  replicas: 2  # Mantener 3 réplicas, igual al número de nodos
  selector:
    matchLabels:
      app: markettool
  template:
    metadata:
      labels:
        app: markettool
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - new-pool  # Asegura que cada Pod esté en un nodo distinto
      terminationGracePeriodSeconds: 60  # Asegura que el Pod tenga tiempo de finalizar procesos
      containers:
      - name: markettool
        image: southamerica-west1-docker.pkg.dev/trading-449607/trading-repo/markettool:latest
        env:
        - name: WEBHOOK_CERT_PATH
          value: "/certs/tls.crt"
        - name: API_FMP
          value: "NRnN8Z4yUQOuqvESjIL8Vny97uLk4G9n"
        - name: BOT_TOKEN
          value: "7820894723:AAFRp-hzu3aLoZ45rVj--OE9LidPyr4eMd0"
        - name: WEBHOOK_URL
          value: "34.8.35.67"
        - name: PUERTO
          value: "8080"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "trading-firestore.json"
        - name: GUNICORN_CMD_ARGS
          value: "--workers=1 --threads=1"  # Evita que más de una solicitud se procese a la vez
        - name: CACHE_WARMUP_LEADER_ONLY
          value: "true"
        - name: CACHE_WARMUP_BLOCKING_STARTUP
          value: "false"
        - name: CACHE_WARMUP_ENABLED
          value: "true"
        - name: CACHE_WARMUP_CONCURRENCY
          value: "2"
        - name: ANALYSIS_PER_SYMBOL_CONCURRENCY
          value: "8"  # Permite 8 temporalidades por activo en paralelo (aumenta throughput)
        volumeMounts:
        - name: gcp-key-volume
          mountPath: "/var/secrets/google"
          readOnly: true
        readinessProbe:
          httpGet:
            path: /ready  # Phase 8: Verifica que el servicio esté listo para tráfico
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 120
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz  # Verifica que el proceso esté vivo
            port: 8080
          initialDelaySeconds: 15
          timeoutSeconds: 5
          periodSeconds: 120
          failureThreshold: 10
        startupProbe:
          httpGet:
            path: /startup  # Phase 8: Permite tiempo extra para warmup inicial
            port: 8080
          initialDelaySeconds: 0
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 30  # 5 minutos máximo para startup (10s * 30)
        resources:
          requests:
            cpu: "1000m"  # Reducir CPU para permitir más Pods
            memory: "900Mi"
          limits:
            cpu: "1800m"  # Mantener un límite sin sobrecargar el nodo
            memory: "1100Mi"
        ports:
        - containerPort: 8080
      volumes:
      - name: gcp-key-volume
        secret:
          secretName: gcp-service-account-key
