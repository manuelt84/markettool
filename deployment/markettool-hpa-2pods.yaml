apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: markettool-hpa
  labels:
    app: markettool
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: markettool
  minReplicas: 2  # Asegura que haya al menos 4 Pods (1 por nodo)
  maxReplicas: 2  # Permite escalar hasta 8 Pods en caso de carga alta
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50  # Escala antes de llegar al 100% de uso
