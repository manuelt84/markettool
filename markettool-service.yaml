apiVersion: v1
kind: Service
metadata:
  name: markettool-service
spec:
  type: LoadBalancer  # Asegura que las solicitudes lleguen correctamente
  sessionAffinity: ClientIP  # Mantiene las solicitudes en el mismo Pod
  ports:
  - name: http
    protocol: TCP
    port: 8080  # Asegurar que el puerto expuesto sea 8080
    targetPort: 8080
  selector:
    app: markettool
