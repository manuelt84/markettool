<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Procesando Telegram - MarketTool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #22d3ee;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Procesando autenticación...</p>
  </div>

  <script>
    (function() {
      // Extract Telegram auth data from URL params
      const params = new URLSearchParams(window.location.search);
      const authData = {};
      params.forEach((value, key) => {
        authData[key] = value;
      });
      
      if (authData.id && authData.hash) {
        console.log('[Callback] Received auth data:', authData);
        
        // Store in sessionStorage
        sessionStorage.setItem('tg_auth_data', JSON.stringify(authData));
        
        // Redirect to main app
        setTimeout(function() {
          window.location.replace('https://markettool.mtlabsx.com/analysis');
        }, 1000);
      } else {
        document.querySelector('.container').innerHTML = 
          '<p style="color: #ef4444;">Error: No se recibieron datos de Telegram</p>' +
          '<p>Redirigiendo...</p>';
        setTimeout(function() {
          window.location.replace('https://markettool.mtlabsx.com/analysis');
        }, 3000);
      }
    })();
  </script>
</body>
</html>
